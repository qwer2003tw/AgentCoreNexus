AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentCore Nexus - Conversation Storage Infrastructure
  DynamoDB tables for conversation history and metadata

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

Resources:
  # ============================================================
  # Conversation History Table - 對話訊息主表
  # ============================================================
  ConversationHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'agentcore-conversation-history-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      # Keys
      AttributeDefinitions:
        - AttributeName: conversation_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: global_partition
          AttributeType: S
        - AttributeName: channel
          AttributeType: S
      
      KeySchema:
        - AttributeName: conversation_id
          KeyType: HASH  # Partition Key
        - AttributeName: timestamp
          KeyType: RANGE  # Sort Key
      
      # Global Secondary Indexes (for admin queries)
      GlobalSecondaryIndexes:
        # GSI-1: Query all conversations by time (fastest for admin)
        - IndexName: GlobalTimestampIndex
          KeySchema:
            - AttributeName: global_partition
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # GSI-2: Query by channel and time
        - IndexName: ChannelTimestampIndex
          KeySchema:
            - AttributeName: channel
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      
      # TTL Configuration (for soft delete)
      TimeToLiveSpecification:
        AttributeName: delete_at
        Enabled: true
      
      # Point-in-Time Recovery (data protection)
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Encryption
      SSESpecification:
        SSEEnabled: true
      
      # Tags
      Tags:
        - Key: Project
          Value: AgentCoreNexus
        - Key: Component
          Value: conversation-storage
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ============================================================
  # Conversation Metadata Table - 對話元數據
  # ============================================================
  ConversationMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'agentcore-conversation-metadata-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      # Keys
      AttributeDefinitions:
        - AttributeName: conversation_id
          AttributeType: S
      
      KeySchema:
        - AttributeName: conversation_id
          KeyType: HASH  # Partition Key only
      
      # Point-in-Time Recovery
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Encryption
      SSESpecification:
        SSEEnabled: true
      
      # Tags
      Tags:
        - Key: Project
          Value: AgentCoreNexus
        - Key: Component
          Value: conversation-storage
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # Note: Identity Map Table moved to separate stack (agentcore-identity-map)
  # This allows independent management and avoids GSI update limitations

Outputs:
  ConversationHistoryTableName:
    Description: Conversation history table name
    Value: !Ref ConversationHistoryTable
    Export:
      Name: !Sub '${AWS::StackName}-ConversationHistoryTableName'
  
  ConversationHistoryTableArn:
    Description: Conversation history table ARN
    Value: !GetAtt ConversationHistoryTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ConversationHistoryTableArn'
  
  ConversationMetadataTableName:
    Description: Conversation metadata table name
    Value: !Ref ConversationMetadataTable
    Export:
      Name: !Sub '${AWS::StackName}-ConversationMetadataTableName'
  
  ConversationMetadataTableArn:
    Description: Conversation metadata table ARN
    Value: !GetAtt ConversationMetadataTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ConversationMetadataTableArn'
