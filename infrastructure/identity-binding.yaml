AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentCore - Identity Binding Infrastructure
  DynamoDB tables for binding codes and identity mapping (Phase 2)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # ============================================================
  # Binding Codes Table - 臨時綁定碼存儲
  # ============================================================
  BindingCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'agentcore-binding-codes-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      
      # TTL 配置：自動刪除過期的綁定碼
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      
      # Point-in-time recovery
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      Tags:
        - Key: Project
          Value: AgentCoreNexus
        - Key: Component
          Value: identity-binding
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ============================================================
  # Identity Map Table - 跨通道身份綁定映射
  # ============================================================
  IdentityMapTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'agentcore-identity-map-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      # Keys - Phase 2 design
      AttributeDefinitions:
        - AttributeName: identity_id
          AttributeType: S
        - AttributeName: unified_conversation_id
          AttributeType: S
      
      KeySchema:
        - AttributeName: identity_id
          KeyType: HASH  # Partition Key (e.g., "tg:316743844", "web:user123")
      
      # GSI for querying all identities with same unified_conversation_id
      GlobalSecondaryIndexes:
        - IndexName: UnifiedConversationIndex
          KeySchema:
            - AttributeName: unified_conversation_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      
      # Point-in-Time Recovery
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Encryption
      SSESpecification:
        SSEEnabled: true
      
      Tags:
        - Key: Project
          Value: AgentCoreNexus
        - Key: Component
          Value: identity-binding
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

Outputs:
  BindingCodesTableName:
    Description: Binding codes table name
    Value: !Ref BindingCodesTable
    Export:
      Name: !Sub '${AWS::StackName}-BindingCodesTableName'
  
  BindingCodesTableArn:
    Description: Binding codes table ARN
    Value: !GetAtt BindingCodesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BindingCodesTableArn'
  
  IdentityMapTableName:
    Description: Identity map table name
    Value: !Ref IdentityMapTable
    Export:
      Name: !Sub '${AWS::StackName}-IdentityMapTableName'
  
  IdentityMapTableArn:
    Description: Identity map table ARN
    Value: !GetAtt IdentityMapTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-IdentityMapTableArn'