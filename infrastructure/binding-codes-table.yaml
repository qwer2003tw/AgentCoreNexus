AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'AgentCore - Identity Binding Codes Table'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  BindingCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'agentcore-binding-codes-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      
      # TTL 配置：自動刪除過期的綁定碼
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      
      # Point-in-time recovery（可選，但建議啟用）
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      Tags:
        - Key: Project
          Value: AgentCoreNexus
        - Key: Component
          Value: identity-binding
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

Outputs:
  BindingCodesTableName:
    Description: Binding codes table name
    Value: !Ref BindingCodesTable
    Export:
      Name: !Sub '${AWS::StackName}-BindingCodesTableName'
  
  BindingCodesTableArn:
    Description: Binding codes table ARN
    Value: !GetAtt BindingCodesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BindingCodesTableArn'