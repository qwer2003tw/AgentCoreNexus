# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
    
    patch:
      default:
        target: 80%
        threshold: 10%
        if_ci_failed: error

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  telegram-lambda:
    paths:
      - telegram-lambda/src/
    carryforward: true
  
  telegram-agentcore-bot:
    paths:
      - telegram-agentcore-bot/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: 70%
  
  individual_components:
    - component_id: telegram-lambda
      name: Telegram Lambda
      paths:
        - telegram-lambda/src/**
    
    - component_id: telegram-agentcore-bot
      name: Telegram AgentCore Bot
      paths:
        - telegram-agentcore-bot/**/*.py

ignore:
  - "**/.aws-sam/"
  - "**/tests/"
  - "**/test_*.py"
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/htmlcov/"
  - "**/node_modules/"
  - "**/dist/"
  - "**/build/"