name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend-lambda:
    name: Backend Tests - telegram-lambda
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd telegram-lambda
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r requirements.txt
          pip install -r requirements-test.txt || true
      
      - name: Run Ruff checks
        run: |
          cd telegram-lambda
          ruff check .
      
      - name: Run tests with coverage
        run: |
          cd telegram-lambda
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./telegram-lambda/coverage.xml
          flags: telegram-lambda
          name: telegram-lambda-coverage
          fail_ci_if_error: false
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-lambda-coverage
          path: telegram-lambda/htmlcov/

  test-backend-agentcore:
    name: Backend Tests - telegram-agentcore-bot
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd telegram-agentcore-bot
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio coverage diff-cover
          pip install -r requirements.txt || true
      
      - name: Run Ruff checks
        run: |
          cd telegram-agentcore-bot
          ruff check .
      
      - name: Run tests with coverage
        run: |
          cd telegram-agentcore-bot
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term --cov-report=html
      
      - name: Check coverage threshold
        run: |
          cd telegram-agentcore-bot
          coverage report --fail-under=70
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./telegram-agentcore-bot/coverage.xml
          flags: telegram-agentcore-bot
          name: telegram-agentcore-bot-coverage
          fail_ci_if_error: false
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-agentcore-bot-coverage
          path: telegram-agentcore-bot/htmlcov/

  test-frontend:
    name: Frontend Tests - web-channel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-channel/e2e-tests/package-lock.json
      
      - name: Install dependencies
        run: |
          cd web-channel/e2e-tests
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd web-channel/e2e-tests
          npx playwright install --with-deps
      
      - name: Run E2E tests
        run: |
          cd web-channel/e2e-tests
          npm test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-channel/e2e-tests/playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-backend-lambda, test-backend-agentcore, test-frontend]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "Test Summary:"
          echo "- telegram-lambda: ${{ needs.test-backend-lambda.result }}"
          echo "- telegram-agentcore-bot: ${{ needs.test-backend-agentcore.result }}"
          echo "- web-channel: ${{ needs.test-frontend.result }}"
          
          if [ "${{ needs.test-backend-lambda.result }}" != "success" ] || \
             [ "${{ needs.test-backend-agentcore.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed!"